[package]
name = "questodian-app"
description = "Questodian as a desktop and iPad app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Mobile builds link the app as a library; desktop runs it from main.rs.
[lib]
name = "questodian_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "questodian-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
questodian-core.workspace = true
axum.workspace = true
rust-embed = "8.14.0"
tauri = { version = "2.12.5", features = [] }
tower.workspace = true
