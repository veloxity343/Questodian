[package]
name = "questodian-app"
description = "Questodian as a desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "questodian-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
# Installing updates in place (Tauri's updater plugin), on in release builds; see
# docs/dev/releasing.md. Without it, the app still checks for updates and opens the release page.
updater = ["dep:tauri-plugin-updater"]

[dependencies]
questodian-core.workspace = true
axum.workspace = true
chrono.workspace = true
reqwest = "0.13.5"
rust-embed = "8.14.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = { version = "2.14.1", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
