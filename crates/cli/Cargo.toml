[package]
name = "questodian-cli"
description = "The questodian command: serve the app, roll dice, search the SRD, import and export."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "questodian"
path = "src/main.rs"

[dependencies]
questodian-core.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
