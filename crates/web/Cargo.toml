[package]
name = "questodian-web"
description = "Questodian's core built for a browser: the API answered inside a Web Worker, stored in the browser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Only built for the browser (wasm32-unknown-unknown); on other targets this crate is empty.
[target.'cfg(target_family = "wasm")'.dependencies]
questodian-core.workspace = true
axum.workspace = true
tower.workspace = true
http-body-util = "0.1.3"
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
# Random numbers from the browser (Crypto.getRandomValues), for ids and dice.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
