[package]
name = "questodian-core"
description = "Questodian's data, rules and HTTP API, shared by the desktop app and the CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
indexmap.workspace = true
mime_guess.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tower.workspace = true
uuid.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }

# In a browser (the web build, crates/web): no threads, files or sockets; time and random
# numbers come from JavaScript.
[target.'cfg(target_family = "wasm")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
tempfile = "3.27.0"
