<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questodian PWA proof</title>
<link rel="icon" href="data:,">
<style>body{font:16px system-ui;margin:24px;max-width:720px} pre{background:#f3efe6;padding:12px;white-space:pre-wrap}</style>
<h1>Questodian PWA proof</h1>
<p>The Rust core and a SQLite database run in this browser, with no server. Each visit adds a
campaign; reload the page and the list should keep growing.</p>
<pre id="out">Starting…</pre>
<script type="module">
const out = document.getElementById("out");
const lines = [];
const log = (line) => { lines.push(line); out.textContent = lines.join("\n"); };
try {
  const worker = new Worker("./worker.js", { type: "module" });
  let next = 0; const waiting = new Map();
  worker.onmessage = ({ data }) => { waiting.get(data.id)?.(data); waiting.delete(data.id); };
  const call = (method, path, body) => new Promise((resolve) => { const id = ++next; waiting.set(id, resolve); worker.postMessage({ id, method, path, body }); });
  const sqlite = await call("GET", "/sqlite");
  if (!sqlite.ok) throw new Error(sqlite.body);
  log(`SQLite ${sqlite.body}, stored in this browser (OPFS)`);
  const hello = await call("GET", "/api/hello");
  log(`GET /api/hello → ${hello.body}`);
  const made = await call("POST", "/api/campaigns", JSON.stringify({ name: `Campaign made ${new Date().toLocaleTimeString()}`, created: new Date().toISOString() }));
  log(`POST /api/campaigns → ${made.body}`);
  const list = JSON.parse((await call("GET", "/api/campaigns")).body).campaigns;
  log(`GET /api/campaigns → ${list.length} campaign(s):`);
  for (const c of list) log(`  ${c.id}. ${c.name}`);
  window.proofCount = list.length;
} catch (e) {
  log(`FAILED: ${e.message ?? e}`);
  window.proofCount = -1;
}
</script>
