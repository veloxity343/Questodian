# Runs every CI check, then builds the desktop app for each OS on that OS and attaches
# the installers to a draft GitHub release. Nothing is built if a check fails.
# Run it by pushing a version tag (v0.2.0) or by hand.
# Based on https://v2.tauri.app/distribute/pipelines/github/
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    name: Tests
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, platform: macos-latest, args: --target aarch64-apple-darwin }
          - { name: macOS Intel, platform: macos-latest, args: --target x86_64-apple-darwin }
          # The oldest Linux we build on decides the oldest glibc the app runs with.
          - { name: Linux x64, platform: ubuntu-22.04, args: "" }
          - { name: Windows x64, platform: windows-latest, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKitGTK and friends (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm ci --prefix frontend
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Questodian v__VERSION__
          releaseBody: Download the installer for your system below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # The draft release already has the installers at this point; if this fails, don't publish it.
      - name: Start the Linux app and check the UI reaches the API
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get install -y xvfb
          mkdir -p "$RUNNER_TEMP/smoke-data"
          QUESTODIAN_DATA="$RUNNER_TEMP/smoke-data" QUESTODIAN_LOG=1 \
            timeout 30 xvfb-run -a target/release/questodian-app > smoke.log 2>&1 || true
          cat smoke.log
          grep -q "GET /api/meta -> 200" smoke.log
