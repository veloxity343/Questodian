# Runs every CI check, creates one draft GitHub release, then builds the desktop app for each
# OS on that OS and attaches the installers to it. Nothing is built if a check fails.
# Run it by pushing a version tag (v0.2.0) or by hand.
# Based on https://v2.tauri.app/distribute/pipelines/github/
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # One draft release for every build to upload into, so all the installers land in one release
  # (build jobs that each made their own would split them across drafts).
  create-release:
    name: Create the draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Create it
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
            -f tag_name="v$version" -f target_commitish="$GITHUB_SHA" -f name="Questodian v$version" \
            -f body="Download the installer for your system below." -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, platform: macos-latest, args: --target aarch64-apple-darwin }
          - { name: macOS Intel, platform: macos-latest, args: --target x86_64-apple-darwin }
          # The oldest Linux we build on decides the oldest glibc the app runs with.
          - { name: Linux x64, platform: ubuntu-22.04, args: "" }
          - { name: Windows x64, platform: windows-latest, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKitGTK and friends (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm ci --prefix frontend
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
      # The draft release already has the installers at this point; if this fails, don't publish it.
      - name: Start the Linux app and check the UI reaches the API
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get install -y xvfb
          mkdir -p "$RUNNER_TEMP/smoke-data"
          # There's no GPU in the virtual display: have WebKitGTK render in software, or it
          # stalls before loading the page.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
          QUESTODIAN_DATA="$RUNNER_TEMP/smoke-data" QUESTODIAN_LOG=1 \
            timeout 60 xvfb-run -a target/release/questodian-app > smoke.log 2>&1 || true
          cat smoke.log
          grep -q "GET /api/meta -> 200" smoke.log
