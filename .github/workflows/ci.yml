name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs all of this before building installers

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop crate needs WebKitGTK; it's built by the release workflow.
      - run: cargo clippy -p questodian-core -p questodian-cli --all-targets -- -D warnings
      - run: cargo test -p questodian-core -p questodian-cli

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend

  package:
    name: Build and smoke-test package
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo build --release -p questodian-cli
      - name: Start the server and check the UI, SRD search and saving work
        run: |
          QUESTODIAN_DATA="$RUNNER_TEMP/smoke-data" target/release/questodian serve --port 8765 --no-browser &
          for i in $(seq 30); do curl -sf localhost:8765/api/meta >/dev/null && break; sleep 1; done
          curl -sf localhost:8765/ | grep -q "<title>Questodian"
          curl -sf "localhost:8765/api/srd/search?q=goblin&category=monsters" | grep -q '"monsters/goblin"'
          curl -sf -X POST localhost:8765/api/characters -H 'content-type: application/json' -d '{"name":"CI"}' | grep -q '"CI"'
      - uses: actions/upload-artifact@v7
        with:
          name: questodian-cli-linux-x64
          path: target/release/questodian
