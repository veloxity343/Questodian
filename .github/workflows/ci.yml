name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs all of this before building installers

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop crate needs WebKitGTK; it's built by the release workflow.
      - run: cargo clippy -p questodian-core -p questodian-cli --all-targets -- -D warnings
      - run: cargo test -p questodian-core -p questodian-cli

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      # SQLite's C code is compiled for WebAssembly with clang.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: cargo clippy -p questodian-core -p questodian-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p questodian-web --target wasm32-unknown-unknown --profile web

  # The whole web version in real browsers: crates/web/smoke/pwa.py. WebKit (the engine Safari is
  # built on, though not Safari) doesn't block merging while we learn how it does.
  web-browsers:
    name: Web version in ${{ matrix.browser }}
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make pwa QUESTODIAN_BASE=/Questodian/
      - run: pip install playwright && python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python crates/web/smoke/pwa.py
        env:
          BROWSER: ${{ matrix.browser }}

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend

  package:
    name: Build and smoke-test package
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo build --release -p questodian-cli
      - name: Start the server and check the UI, SRD search and saving work
        run: |
          QUESTODIAN_DATA="$RUNNER_TEMP/smoke-data" target/release/questodian serve --port 8765 --no-browser &
          for i in $(seq 30); do curl -sf localhost:8765/api/meta >/dev/null && break; sleep 1; done
          curl -sf localhost:8765/ | grep -q "<title>Questodian"
          curl -sf "localhost:8765/api/srd/search?q=goblin&category=monsters" | grep -q '"monsters/goblin"'
          curl -sf -X POST localhost:8765/api/characters -H 'content-type: application/json' -d '{"name":"CI"}' | grep -q '"CI"'
      - uses: actions/upload-artifact@v7
        with:
          name: questodian-cli-linux-x64
          path: target/release/questodian
