name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs all of this before building installers

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend

  rust:
    name: Rust backend (and parity with Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: cargo fmt --all --check
      # The desktop crate needs WebKitGTK; it's built by the release workflow.
      - run: cargo clippy -p questodian-core -p questodian-cli --all-targets -- -D warnings
      - run: cargo test -p questodian-core -p questodian-cli
      - run: cargo build -p questodian-cli
      - run: uv sync --locked
      - name: Compare the Rust and Python servers
        run: uv run python scripts/parity.py

  package:
    name: Build and smoke-test package
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build wheel and sdist (with the compiled UI)
        run: make package
      - name: Install the wheel in a clean environment and start it
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          QUESTODIAN_DATA=/tmp/smoke-data /tmp/smoke/bin/questodian serve --port 8765 --no-browser &
          for i in $(seq 30); do curl -sf localhost:8765/api/meta >/dev/null && break; sleep 1; done
          curl -sf localhost:8765/ | grep -q "<title>Questodian"
          curl -sf "localhost:8765/api/srd/search?q=goblin&category=monsters" | grep -q '"monsters/goblin"'
          curl -sf -X POST localhost:8765/api/characters -H 'content-type: application/json' -d '{"name":"CI"}' | grep -q '"CI"'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
