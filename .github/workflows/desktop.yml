name: Desktop app

# Builds the Windows and macOS apps. Runs on version tags (v0.2.0 …), which also
# publishes a GitHub Release with the zips, and on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Questodian-windows-x64
          - os: macos-latest
            name: Questodian-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv sync --locked --group build --extra desktop
      - name: Build the app
        working-directory: packaging
        run: uv run pyinstaller --noconfirm --distpath ../dist-desktop --workpath ../build-desktop questodian.spec
      - name: Smoke-test the bundle (server mode)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="dist-desktop/Questodian.app/Contents/MacOS/Questodian"; else BIN="dist-desktop/Questodian/Questodian.exe"; fi
          "$BIN" --data-dir "$RUNNER_TEMP/data" serve --port 8765 --no-browser &
          for i in $(seq 60); do curl -sf localhost:8765/api/meta >/dev/null && break; sleep 1; done
          curl -sf localhost:8765/ | grep -q "<title>Questodian"
          curl -sf "localhost:8765/api/srd/search?q=zombie&category=monsters&edition=2024" | grep -q '"monsters/zombie"'
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist-desktop/Questodian" -DestinationPath "${{ matrix.name }}.zip"
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist-desktop/Questodian.app" "${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --title "Questodian $GITHUB_REF_NAME" --generate-notes
