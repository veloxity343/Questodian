[project]
name = "questodian"
version = "0.1.1"
description = "All-in-one 5e table manager: sessions, initiative, character sheets, SRD reference, handbook, dice and calculator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rcheong", email = "ryan.cheongtl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.1"]

[project.scripts]
questodian = "questodian:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.16",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
