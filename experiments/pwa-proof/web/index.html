<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questodian PWA proof</title>
<style>body{font:16px system-ui;margin:24px;max-width:720px} pre{background:#f3efe6;padding:12px;white-space:pre-wrap}</style>
<h1>Questodian PWA proof</h1>
<p>Each line is a request answered by the Rust core running in this browser, with no server.</p>
<pre id="out">Starting…</pre>
<script type="module">
const out = document.getElementById("out");
const worker = new Worker("./worker.js", { type: "module" });
let next = 0; const waiting = new Map();
worker.onmessage = ({ data }) => { waiting.get(data.id)?.(data); waiting.delete(data.id); };
const call = (method, path) => new Promise((resolve) => { const id = ++next; waiting.set(id, resolve); worker.postMessage({ id, method, path }); });
const log = (line) => { out.textContent = (out.textContent === "Starting…" ? "" : out.textContent + "\n") + line; };
const r = await call("GET", "/api/hello");
log(`GET /api/hello → ${r.ok ? r.body : "ERROR " + r.body}`);
window.proofDone = true;
</script>
